# TLS termination for the local/LAN stack.
#
# One origin for the browser: this proxy is the only thing a client ever
# talks to. /api/* goes to pythonapi, everything else goes to the Next.js
# app. That is what lets NEXT_PUBLIC_PYTHON_API_URL stay empty and the AG-UI
# SSE stream avoid CORS entirely - see apps/agentic-executor/.env.example.
#
# Certs come from mkcert (infra/nginx/certs/, gitignored). Regenerate with
# infra/nginx/make-certs.ps1 if the LAN IP in docker-compose.yml changes.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen 80;
        server_name _;
        # Plain HTTP is dev-only noise here, not a security boundary - just
        # send it straight to HTTPS instead of answering on both ports.
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/dev-cert.pem;
        ssl_certificate_key /etc/nginx/certs/dev-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # FastAPI first and more specific: a prefix match on "/" would
        # otherwise shadow "/api/" since nginx has no route-priority beyond
        # match specificity and declaration order for prefix locations.
        location /api/ {
            proxy_pass http://pythonapi:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # AG-UI and the voice event stream are SSE: a proxy that buffers
            # holds the whole response until it closes, so the browser sees
            # nothing until the stream ends. Both directives, plus no
            # timeout, keep events flowing as FastAPI emits them.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            chunked_transfer_encoding off;
        }

        location / {
            proxy_pass http://web:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Next dev's HMR socket. Harmless on the standalone/production
            # build, which never opens it.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
