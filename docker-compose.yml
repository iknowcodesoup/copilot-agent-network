services:
  web:
    build:
      context: .
      dockerfile: apps/agentic-executor/Dockerfile
      args:
        # Next inlines NEXT_PUBLIC_* at build time, so it must be a build arg.
        # project.json passes the app's env file to `--env-file`, because an
        # `env_file:` entry is not visible to interpolation.
        NEXT_PUBLIC_PYTHON_API_URL: ${NEXT_PUBLIC_PYTHON_API_URL:-http://localhost:8000}
    # A later file wins, so `.env.local` overrides the production `.env`.
    # No file is required: the app falls back to its own defaults.
    env_file:
      - path: apps/agentic-executor/.env
        required: false
      - path: apps/agentic-executor/.env.local
        required: false
    ports:
      - "4001:3000"
    depends_on:
      pythonapi:
        condition: service_started

  pythonapi:
    build:
      context: .
      dockerfile: apps/pythonapi/Dockerfile
    ports:
      - "8000:8000"
    extra_hosts:
      # Lets the container reach a local LM Studio/Ollama server running on
      # the host. Docker Desktop (Windows/Mac) resolves this automatically;
      # the mapping is required for Docker on Linux.
      - "host.docker.internal:host-gateway"
    volumes:
      - hf-cache:/root/.cache/huggingface
    # A later file wins, so `.env.local` overrides the production `.env`.
    # No file is required: defaults come from config.py, not from here.
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
      - path: apps/pythonapi/.env
        required: false
      - path: apps/pythonapi/.env.local
        required: false
    depends_on:
      redis:
        condition: service_started
      langfuse:
        condition: service_healthy
      litellm:
        condition: service_started
      pythonapi-db:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  litellm:
    image: docker.litellm.ai/berriai/litellm:latest
    command: ["--config", "/app/config.yaml"]
    ports:
      - "4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./apps/pythonapi/litellm.config.yaml:/app/config.yaml:ro
    # Explicit because these keys are renamed, which env_file: cannot express.
    environment:
      LITELLM_MASTER_KEY: ${LLM_API_KEY:-}
      LITELLM_UPSTREAM_API_BASE: ${LITELLM_UPSTREAM_API_BASE:-http://host.docker.internal:1234/v1}
      LITELLM_UPSTREAM_API_KEY: ${LITELLM_UPSTREAM_API_KEY:-}
      LITELLM_CHAT_BACKEND_MODEL: ${LITELLM_CHAT_BACKEND_MODEL:-openai/gemma-4}
      LITELLM_EMBEDDING_BACKEND_MODEL: ${LITELLM_EMBEDDING_BACKEND_MODEL:-openai/text-embedding-nomic}
      LLM_MODEL: ${LLM_MODEL:-chat-default}
      LITELLM_UPSTREAM2_API_BASE: ${LITELLM_UPSTREAM2_API_BASE:-http://host.docker.internal:9379/v1}
      LITELLM_CHAT2_BACKEND_MODEL: ${LITELLM_CHAT2_BACKEND_MODEL:-openai/gemma-4-12B-it-gpu.litertlm}
      LLM2_MODEL: ${LLM2_MODEL:-chat-backup}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embedding-default}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      DATABASE_URL: postgresql://litellm:litellm@litellm-db:5432/litellm
    depends_on:
      langfuse:
        condition: service_healthy
      litellm-db:
        condition: service_healthy

  litellm-db:
    image: postgres:16
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    volumes:
      - litellm-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10

  pythonapi-db:
    image: postgres:16
    environment:
      POSTGRES_USER: pythonapi
      POSTGRES_PASSWORD: pythonapi
      POSTGRES_DB: pythonapi
    volumes:
      - pythonapi-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pythonapi -d pythonapi"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse-db:
    image: postgres:16
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2
    ports:
      - "4002:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:4002}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      SALT: ${SALT:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      HOSTNAME: 0.0.0.0
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-local-org}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-Local Org}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-pythonapi}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-pythonapi}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@example.com}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-Admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
    depends_on:
      langfuse-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/public/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  langfuse-postgres:
  pythonapi-postgres:
  litellm-postgres:
  qdrant-data:
  redis-data:
  hf-cache:
