# Dev overlay for `docker compose -f docker-compose.watch.yml watch`.
#
# Every service that swaps in a `.dev` Dockerfile MUST also declare an explicit
# `image:` tag. Without one, Compose derives the tag from project + service name,
# which is identical to the tag docker-compose.yml produces. `up` then reuses
# whichever image was built last - so the dev command silently runs inside the
# production image (a Next.js standalone bundle with no package.json, no
# pnpm-workspace.yaml, and no lockfile).
services:
  web:
    image: copilot_agent_network-web-dev
    build:
      context: .
      dockerfile: apps/agentic-executor/Dockerfile.dev
    working_dir: /app/apps/agentic-executor
    command:
      [
        "corepack",
        "pnpm",
        "exec",
        "next",
        "dev",
        "--hostname",
        "0.0.0.0",
        "--port",
        "3000",
      ]
    ports:
      - "4001:3000"
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      # Browser-facing (the chat talks to FastAPI directly), so this is the
      # published host port rather than the pythonapi service hostname.
      # `next dev` reads it per-request, so no build arg is needed here.
      NEXT_PUBLIC_PYTHON_API_URL: ${NEXT_PUBLIC_PYTHON_API_URL:-http://localhost:8000}
    develop:
      watch:
        - action: sync
          path: ./apps/agentic-executor/src
          target: /app/apps/agentic-executor/src
        - action: sync
          path: ./apps/agentic-executor/public
          target: /app/apps/agentic-executor/public
        - action: sync+restart
          path: ./apps/agentic-executor/next.config.js
          target: /app/apps/agentic-executor/next.config.js
        - action: rebuild
          path: ./apps/agentic-executor/package.json
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

  pythonapi:
    image: copilot_agent_network-pythonapi-dev
    build:
      context: .
      dockerfile: apps/pythonapi/Dockerfile.dev
    command:
      [
        "uv",
        "run",
        "uvicorn",
        "pythonapi.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    extra_hosts:
      # Lets the container reach a local LM Studio/Ollama server running on
      # the host. Docker Desktop (Windows/Mac) resolves this automatically;
      # the mapping is required for Docker on Linux.
      - "host.docker.internal:host-gateway"
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?LANGFUSE_PUBLIC_KEY must be set in .env}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?LANGFUSE_SECRET_KEY must be set in .env}
      POSTGRES_URL: ${PYTHONAPI_POSTGRES_URL:-postgresql://pythonapi:pythonapi@pythonapi-db:5432/pythonapi}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      # pythonapi, BAML, and the public /api/v1 proxy all go through the same
      # LiteLLM gateway. LiteLLM then routes to the real backend model server
      # (LM Studio by default). EMBEDDING_DIM must match the dense embedding
      # model exposed by the gateway (768 for nomic-embed).
      LLM_BASE_URL: ${LLM_BASE_URL:-http://litellm:4000/v1}
      LLM_API_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set in .env}
      LLM_MODEL: ${LLM_MODEL:-chat-default}
      # The web app calls /api/agent from the browser, so its origin needs to
      # be allowed here. This is the published web port, not the container's.
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:4001}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai_compatible}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embedding-default}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      EMBEDDING_SPARSE_MODEL: ${EMBEDDING_SPARSE_MODEL:-Qdrant/bm25}
      HF_TOKEN: ${HF_TOKEN:-}
      RERANK_PROVIDER: ${RERANK_PROVIDER:-cross_encoder}
      RERANK_MODEL: ${RERANK_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      GENERATION_PROVIDER: ${GENERATION_PROVIDER:-baml}
      # Required (not defaulted): an unset key/salt disables PII masking
      # entirely rather than degrading gracefully - see .env.
      PII_VAULT_ENCRYPTION_KEY: ${PII_VAULT_ENCRYPTION_KEY:?PII_VAULT_ENCRYPTION_KEY must be set in .env}
      PII_VAULT_SALT: ${PII_VAULT_SALT:?PII_VAULT_SALT must be set in .env}
    depends_on:
      redis:
        condition: service_started
      langfuse:
        condition: service_healthy
      litellm:
        condition: service_started
      pythonapi-db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./apps/pythonapi/pythonapi
          target: /app/pythonapi
        - action: sync
          path: ./apps/pythonapi/tests
          target: /app/tests
        - action: sync+restart
          path: ./apps/pythonapi/pyproject.toml
          target: /app/pyproject.toml
        - action: rebuild
          path: ./apps/pythonapi/uv.lock
        - action: rebuild
          path: ./apps/pythonapi/Dockerfile.dev

  litellm:
    image: docker.litellm.ai/berriai/litellm:latest
    command: ["--config", "/app/config.yaml"]
    ports:
      - "4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./apps/pythonapi/litellm.config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set in .env}
      LITELLM_UPSTREAM_API_BASE: ${LITELLM_UPSTREAM_API_BASE:-http://host.docker.internal:1234/v1}
      LITELLM_UPSTREAM_API_KEY: ${LITELLM_UPSTREAM_API_KEY:?LITELLM_UPSTREAM_API_KEY must be set in .env}
      LITELLM_CHAT_BACKEND_MODEL: ${LITELLM_CHAT_BACKEND_MODEL:-openai/gemma-4}
      LITELLM_EMBEDDING_BACKEND_MODEL: ${LITELLM_EMBEDDING_BACKEND_MODEL:-openai/text-embedding-nomic}
      LLM_MODEL: ${LLM_MODEL:-chat-default}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embedding-default}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?LANGFUSE_PUBLIC_KEY must be set in .env}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?LANGFUSE_SECRET_KEY must be set in .env}
    depends_on:
      langfuse:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  pythonapi-db:
    image: postgres:16
    environment:
      POSTGRES_USER: pythonapi
      POSTGRES_PASSWORD: pythonapi
      POSTGRES_DB: pythonapi
    volumes:
      - pythonapi-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pythonapi -d pythonapi"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse-db:
    image: postgres:16
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2
    ports:
      - "4002:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:4002}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set in .env}
      SALT: ${SALT:?SALT must be set in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set in .env}
      HOSTNAME: 0.0.0.0
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-local-org}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-Local Org}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-pythonapi}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-pythonapi}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?LANGFUSE_PUBLIC_KEY must be set in .env}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?LANGFUSE_SECRET_KEY must be set in .env}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@example.com}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-Admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?LANGFUSE_INIT_USER_PASSWORD must be set in .env}
    depends_on:
      langfuse-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/public/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  langfuse-postgres:
  pythonapi-postgres:
  qdrant-data:
  redis-data:
  hf-cache:
