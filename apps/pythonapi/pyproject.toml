[tool.coverage.run]
branch = true
source = [ "pythonapi" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/apps/pythonapi/html'
 --cov-report xml:'../../coverage/apps/pythonapi/coverage.xml'
 --html='../../reports/apps/pythonapi/unittests/html/index.html'
 --junitxml='../../reports/apps/pythonapi/unittests/junit.xml'
"""

[project]
name = "pythonapi"
version = "1.0.0"
description = "Automatically generated by Nx."
requires-python = ">=3.10,<3.15"
readme = 'README.md'
dependencies = [
  "asyncpg>=0.31.0",
  "cachetools>=5.5.0",
  "copilotkit>=0.1.94",
  "fastapi>=0.116.1",
  "langchain>=1.3.14",
  "langfuse>=4.14.2",
  "langgraph>=1.2.10",
  "limits>=4.0.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.20",
  "qdrant-client>=1.19.0",
  "redis>=6.4.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "tenacity>=9.0.0",
  "uvicorn>=0.35.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pythonapi"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
  "autopep8>=2.3.1",
  "fakeredis>=2.26.0",
  "httpx>=0.28.1",
  "ruff>=0.8.2",
  "pytest>=8.3.4",
  "pytest-asyncio>=0.24.0",
  "pytest-sugar>=1.0.0",
  "pytest-cov>=6.0.0",
  "pytest-html>=4.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
exclude = [
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "dist",
]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
  "E",
  "F",
  "UP",
  "B",
  "SIM",
  "I",
]
ignore = [
  "B008", # Depends(...) in argument defaults is FastAPI's documented DI pattern.
]

fixable = ["ALL"]
unfixable = []
