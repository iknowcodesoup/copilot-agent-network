[tool.coverage.run]
branch = true
source = [ "pythonapi" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/apps/pythonapi/html'
 --cov-report xml:'../../coverage/apps/pythonapi/coverage.xml'
 --html='../../reports/apps/pythonapi/unittests/html/index.html'
 --junitxml='../../reports/apps/pythonapi/unittests/junit.xml'
"""

[project]
name = "pythonapi"
version = "1.0.0"
description = "Automatically generated by Nx."
requires-python = ">=3.10,<3.15"
readme = 'README.md'
dependencies = [
  "a2a-sdk[fastapi]>=1.1.2,<2.0.0",
  # The AG-UI protocol types/encoder are the entire contract with the
  # CopilotKit v2 frontend, which speaks AG-UI natively over SSE. The
  # `copilotkit` SDK is deliberately absent: it implements the v1 remote-
  # endpoint protocol, which v2 clients cannot talk to.
  "ag-ui-protocol>=0.1.19",
  "asyncpg>=0.31.0",
  "baml-py>=0.75.0",
  "cachetools>=5.5.0",
  "cryptography>=43.0.0",
  "docling>=2.15.0",
  "fastapi>=0.116.1",
  "fastembed>=0.4.2",
  "langchain>=1.3.14",
  "langfuse>=4.14.2",
  "langgraph>=1.2.10",
  "limits>=4.0.0",
  "openai>=1.55.0",
  "presidio-analyzer>=2.2.358",
  "presidio-anonymizer>=2.2.358",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.20",
  "qdrant-client>=1.19.0",
  # Capped, and the floor matches what is locked. 8.1 defaults the socket
  # timeout to 5s where earlier versions blocked forever, and the unbounded
  # ">=6.4.0" floor let that arrive silently. It aborted every blocking read.
  # Read the release notes before you move either bound.
  "redis>=8.1.0,<9.0.0",
  "sentence-transformers>=3.3.1",
  "spacy>=3.8.0,<3.9.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "tenacity>=9.0.0",
  "torch>=2.0.0",
  "torchvision>=0.15.0",
  "uvicorn>=0.35.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pythonapi"]

[tool.hatch.metadata]
allow-direct-references = true

# CPU-only torch builds: docling/sentence-transformers/presidio all pull torch
# transitively, and the default PyPI wheels drag in several GB of NVIDIA CUDA
# libraries that are dead weight in this CPU-only container.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
  "autopep8>=2.3.1",
  "fakeredis>=2.26.0",
  "httpx>=0.28.1",
  "ruff>=0.8.2",
  "pytest>=8.3.4",
  "pytest-asyncio>=0.24.0",
  "pytest-sugar>=1.0.0",
  "pytest-cov>=6.0.0",
  "pytest-html>=4.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
exclude = [
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "dist",
  # Generated by `uv run baml-cli generate` from baml_src/ - not
  # hand-maintained, regenerate rather than edit.
  "pythonapi/baml_client",
]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
  "E",
  "F",
  "UP",
  "B",
  "SIM",
  "I",
]
ignore = [
  "B008", # Depends(...) in argument defaults is FastAPI's documented DI pattern.
]

fixable = ["ALL"]
unfixable = []
